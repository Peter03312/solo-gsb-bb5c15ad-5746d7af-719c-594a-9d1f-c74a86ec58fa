services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: racer
      POSTGRES_PASSWORD: racer
      POSTGRES_DB: race_timing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racer -d race_timing"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://racer:racer@db:5432/race_timing
    ports:
      - "8000:8000"

volumes:
  pgdata:
